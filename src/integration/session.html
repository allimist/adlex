<script>
/* AdLex 1/3 — session. Put in <head> on every page, before the other two scripts. */
(function () {
  var ADLEX = '__ADLEX_URL__';
  var DAYS = 30;

  function getCookie(name) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  function setCookie(name, value) {
    var exp = new Date(Date.now() + DAYS * 864e5).toUTCString();
    document.cookie = name + '=' + encodeURIComponent(value) + ';expires=' + exp + ';path=/;SameSite=Lax';
  }
  function deleteCookie(name) {
    document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
  }

  var params = new URLSearchParams(window.location.search);
  var adKey = ['gclid', 'msclkid', 'fbclid'].filter(function (k) { return params.get(k); })[0] || '';
  var adChanged = !!adKey && params.get(adKey) !== getCookie(adKey);
  var pagePath = window.location.pathname.replace(/^\/|\/$/g, '');

  // Keep this visit's landing params in cookies ({token} values for the links).
  function saveParams() {
    for (var i = 1; i <= 20; i++) deleteCookie('t' + i); // belong to the previous click
    params.forEach(function (value, key) { setCookie(key, value); });
    if (adKey) {
      setCookie('clickIdType', adKey);
      setCookie('clickId', params.get(adKey));
    }
    setCookie('page_url', pagePath);
  }

  // a) Came through an AdLex campaign link: AdLex already created the click and passed ?se=…
  var seParam = params.get('se');
  if (seParam) {
    if (seParam !== getCookie('se')) saveParams();
    return;
  }

  // b) Direct visit (ad final URL, organic, returning): ask AdLex for a click id,
  //    unless this visitor already has one and it is still the same ad click.
  if (getCookie('se') && !adChanged) return;
  saveParams();
  var query = new URLSearchParams(params);
  query.set('page_url', pagePath);
  fetch(ADLEX + '/se/?' + query.toString())
    .then(function (r) { return r.ok ? r.text() : ''; }) // errors (e.g. site not in AdLex) never become an id
    .then(function (id) {
      id = (id || '').trim();
      if (!id) return;
      setCookie('se', id);
      document.dispatchEvent(new Event('adlex:session')); // lets the link script fill {se}
    })
    .catch(function () {});
})();
</script>
